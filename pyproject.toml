[project]
name = "quantflow"
version = "0.1.0"
description = "Generative market models for option-chain calibration and deep hedging (SPX/VIX, BTC/ETH)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry", email = "dimanvseok@gmail.com" }]

# v1.0 scope only. Do NOT add streamlit / Deribit / Rust deps here — those are v4.0.
dependencies = [
    "numpy>=1.26",
    "jax>=0.4",            # vectorized SDE simulation + samplers (numpyro is jax-native)
    "torch>=2.2",          # primary DL framework
    "torchsde>=0.2.6",     # neural SDE with adjoint backprop (PyTorch-only)
    "numpyro>=0.15",       # NUTS sampler for Heston MCMC baseline
    "yfinance>=0.2.40",    # free SPX option-chain ETL
    "polars>=1.0",         # primary DataFrame lib (time-series joins)
    "pandas>=2.2",         # interop only
    "pyarrow>=16.0",
    "matplotlib>=3.8",     # static figures
    "altair>=5.3",         # interactive figures
    "scipy>=1.17.1",
]

# uv installs this group automatically on `uv sync` (PEP 735).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",   # property-based tests on SDE samplers
    "ruff>=0.6",
    "mypy>=1.10",
    "ipykernel>=6.29",     # run the notebooks/ narrative
    "jupyterlab>=4.2",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false            # research repo: flat lib/ modules, not an installable package

# Ruff is configured in ruff.toml, which takes precedence over any [tool.ruff] here.
# Keeping a second, disagreeing copy in this file is what let 80 violations go unnoticed.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true         # torchsde/yfinance ship no stubs
