# The single lint gate. `ruff.toml` takes precedence over any [tool.ruff] in pyproject.toml,
# so that section has been removed rather than left as dead config disagreeing with this one.
#
# `select = ["ALL"]` with a deliberate ignore list: everything below is a style the project
# has chosen on purpose, not a rule that was too annoying to satisfy. `uv run ruff check`
# passes clean, so a new violation is real signal.
target-version = "py311"
line-length = 100

[lint]
select = ["ALL"]
ignore = [
    "D203",    # incompatible with D211 (chose D211: no blank line before class)
    "D213",    # incompatible with D212 (chose D212: summary on first line)
    "N999",    # invalid module name
    "S101",    # use of assert (allowed in tests)
    "TID252",  # relative imports: the project's chosen intra-package style throughout
    "PLR0913", # many arguments: the numeric APIs take (k, s_0, r, t, call, ...) by nature
    "PLR2004", # magic values in comparisons: thresholds read better inline in the maths
    "FBT003",  # boolean positional: third-party APIs (jax.config.update) require it
    "ERA001",  # false-positives on the `# ---- section ----` dividers used across the code
]

[lint.per-file-ignores]
# Test idioms, not lapses: tests assert (S101), exercise private helpers (SLF001), pass
# deliberately-unused args to fakes and monkeypatch lambdas (ARG*), take bool params from
# parametrize (FBT001), and live in directories without __init__.py because pytest's
# rootdir/pythonpath layout wants it that way (INP001).
"tests/**" = [
    "S101", "ANN", "D", "PLR2004", "SLF001", "ARG001", "ARG002", "ARG005",
    "INP001", "FBT001", "EM101", "TRY003", "PLC0415", "ICN001",
]
